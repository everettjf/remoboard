name: Remoboard
options:
  bundleIdPrefix: com.everettjf
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "7.1"
    CURRENT_PROJECT_VERSION: "7100"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: YPV49M8592
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  RemoboardKit:
    type: framework
    platform: iOS
    sources:
      - path: RemoboardKit/Sources
      - path: RemoboardKit/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.remoboardkit
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "7100"
        MARKETING_VERSION: "7.1"

  Remoboard:
    type: application
    platform: iOS
    sources:
      - path: remoboard
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: RemoboardKit
        embed: true
      - target: RemoKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.remotekb
        PRODUCT_NAME: Remoboard
        INFOPLIST_FILE: remoboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: remoboard/Remoboard.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RemoKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: keyboard
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: RemoboardKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.remotekb.keyboard
        PRODUCT_NAME: RemoKeyboard
        INFOPLIST_FILE: keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: keyboard/RemoKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: "YES"

# Explicit shared schemes. The iOS app target shares the project name "Remoboard",
# which makes XcodeGen's auto-scheme generation skip it, so declare schemes here.
schemes:
  Remoboard:
    build:
      targets:
        Remoboard: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
